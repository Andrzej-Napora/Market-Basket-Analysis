instacart:
  target: dev
  outputs:
    dev:
      type: postgres
      host: postgres
      user: "{{env_var('POSTGRES_USER')}}"
      password: "{{env_var('POSTGRES_PASSWORD')}}"
      port: 5432
      dbname: "{{env_var('POSTGRES_DB')}}"
      schema: dbt_dev
      threads: 3

    prod:
      type: postgres
      host: postgres
      user: "{{env_var('POSTGRES_USER')}}"
      password: "{{env_var('POSTGRES_PASSWORD')}}"
      port: 5432
      dbname: "{{env_var('POSTGRES_DB')}}"
      schema: analytics
      threads: 3
