services:
    postgres:
        image: postgres
        shm_size: "8gb"
        environment: 
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5432:5432"
        networks:
            - instacart_network
        volumes: 
            - instacart_postgres_data:/var/lib/postgresql
            - ./backup:/backup
    jupyter:
        build:
            context: .
            dockerfile: dockerfile.jupyter
        image: instacart_jupyter
        ports:
            - "8888:8888"
        networks:
            - instacart_network
        volumes:
            - ./notebooks:/home/jovyan/work
    dbt:
        build:
            context: .
            dockerfile: dockerfile.dbt
        image: instacart_dbt
        environment: 
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_DB: ${POSTGRES_DB}
        networks:
            - instacart_network
        working_dir: /app/dbt
        volumes: 
            - ./dbt:/app/dbt
            - ./dbt_profiles:/root/.dbt
        depends_on:
            - postgres
volumes:
    instacart_postgres_data:
        external: true
networks:
    instacart_network:
        external: true
