services:
    postgres:
        image: postgres
        environment: 
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_USER: $POSTGRES_USER}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5432:5432"
        networks:
            - instacart_network
        volumes: 
            - instacart_postgres_data:/var/lib/postgresql
            - ./backup:/backup
    jupyter:
        build: .
        image: instacart_jupyter
        ports:
            - "8888:8888"
        networks:
            - instacart_network
        volumes:
            - ./notebooks:/home/jovyan/work
volumes:
    instacart_postgres_data:
        external: true
networks:
    instacart_network:
        external: true
