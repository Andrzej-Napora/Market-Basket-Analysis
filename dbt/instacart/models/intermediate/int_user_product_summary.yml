models:
  - name: int_user_product_summary
    columns:
      - name: user_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: user_product_purchase_count
        data_tests:
          - not_null

      - name: last_product_order_number
        data_tests:
          - not_null
